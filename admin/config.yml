# Fichier généré par scripts/config-cms.mjs - ne pas modifier à la main (npm run config-cms).
{
  "backend": {
    "name": "github",
    "repo": "emirgc/yd",
    "branch": "main",
    "commit_messages": {
      "create": "CMS : ajout de {{collection}} « {{slug}} »",
      "update": "CMS : modification de {{collection}} « {{slug}} »",
      "delete": "CMS : suppression de {{collection}} « {{slug}} »",
      "uploadMedia": "CMS : ajout du fichier {{path}}",
      "deleteMedia": "CMS : suppression du fichier {{path}}"
    }
  },
  "site_url": "https://youssefdhane.net",
  "display_url": "https://youssefdhane.net",
  "logo": {
    "src": "/images/site/favicon.svg"
  },
  "media_folder": "/images/portfolio",
  "public_folder": "/images/portfolio",
  "media_libraries": {
    "default": {
      "config": {
        "slugify_filename": true
      }
    }
  },
  "collections": [
    {
      "name": "portfolio",
      "label": "Portfolio",
      "description": "Images et catégories du portfolio. L'ordre de la liste est l'ordre d'affichage : glissez les images pour les réordonner.",
      "files": [
        {
          "name": "portfolio",
          "label": "Images et catégories",
          "file": "data/portfolio.json",
          "fields": [
            {
              "name": "images",
              "label": "Images",
              "label_singular": "image",
              "widget": "list",
              "add_to_top": true,
              "summary": "{{fields.titre}}",
              "fields": [
                {
                  "name": "fichier",
                  "label": "Image (JPG, 2400 px de large maximum)",
                  "widget": "image",
                  "media_folder": "/images/portfolio",
                  "public_folder": "/images/portfolio"
                },
                {
                  "name": "titre",
                  "label": "Titre (français)",
                  "widget": "string"
                },
                {
                  "name": "titre_en",
                  "label": "Titre (anglais)",
                  "widget": "string",
                  "required": false,
                  "hint": "Facultatif : sans lui, le titre français s'affiche aussi sur le site anglais."
                },
                {
                  "name": "categorie",
                  "label": "Catégorie",
                  "widget": "relation",
                  "collection": "portfolio",
                  "file": "portfolio",
                  "search_fields": [
                    "categories.*.nom"
                  ],
                  "display_fields": [
                    "categories.*.nom"
                  ],
                  "value_field": "categories.*.id"
                },
                {
                  "name": "vedette",
                  "label": "En vedette (diaporama et sélection de l'accueil)",
                  "widget": "boolean",
                  "default": false,
                  "required": false
                },
                {
                  "name": "largeur",
                  "label": "Largeur",
                  "widget": "hidden"
                },
                {
                  "name": "hauteur",
                  "label": "Hauteur",
                  "widget": "hidden"
                }
              ]
            },
            {
              "name": "categories",
              "label": "Catégories",
              "label_singular": "catégorie",
              "widget": "list",
              "summary": "{{fields.nom}}",
              "fields": [
                {
                  "name": "id",
                  "label": "Identifiant (minuscules, sans espaces ni accents, ex. vehicule)",
                  "widget": "string",
                  "pattern": [
                    "^[a-z0-9-]+$",
                    "Minuscules, chiffres et tirets seulement"
                  ]
                },
                {
                  "name": "nom",
                  "label": "Nom (français)",
                  "widget": "string"
                },
                {
                  "name": "nom_en",
                  "label": "Nom (anglais)",
                  "widget": "string",
                  "required": false
                }
              ]
            }
          ]
        }
      ]
    },
    {
      "name": "videos",
